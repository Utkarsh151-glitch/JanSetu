<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>JanSetu Companion</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">ज</span><div><strong>JanSetu</strong><small>Companion</small></div></div>
    <p>Find a clear route to selected official services.</p>
  </header>
  <main>
    <section id="current" class="surface" aria-live="polite"><p>Checking this tab…</p></section>
    <section aria-labelledby="find-heading">
      <h1 id="find-heading">Find a portal</h1>
      <label for="search">Search by need or name</label>
      <input id="search" type="search" autocomplete="off" placeholder="e.g. complaint or documents">
      <p id="count" class="muted" aria-live="polite"></p>
      <div id="results"></div>
    </section>
    <p class="notice">JanSetu is independent. It does not change official websites or read forms, passwords, or OTPs. Check the official site for current rules.</p>
    <p><a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy policy</a></p>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
